plugins {
    id 'com.android.application'
}
def androidProject = projectDir.parentFile
def repoRoot = androidProject.parentFile

// The ABIs the native build produces and the ones the APKs are split along have to agree. Held
// once, because two identical lists twenty lines apart drift, and the failure is an APK for an
// architecture with no libisle.so in it.
def isleAbis = ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64']

// The version CPack already derives its own from, so the two cannot disagree.
def projectVersion = {
    def matcher = new File(repoRoot, 'CMakeLists.txt').text =~ /project\(isle\b[^)]*\bVERSION\s+([0-9][0-9.]*)/
    return matcher ? matcher[0][1] : '0'
}()

def gitOutput = { List<String> args ->
    try {
        def output = providers.exec {
            commandLine(['git', '-C', repoRoot.path] + args)
            ignoreExitValue = true
        }
        // A non-zero exit is a question git answered with "no"; a missing git throws instead.
        return output.result.get().exitValue == 0 ? output.standardOutput.asText.get().trim() : null
    }
    catch (Exception ignored) {
        return null
    }
}

// versionCode is the commit count, which is the only monotone source here: the sole tag is
// `continuous`, a rolling tag that gets re-pointed, so git describe would count backwards.
def isleVersion = {
    if (project.hasProperty('isleVersionCode')) {
        def override = project.isleVersionCode as int
        return [override, "${projectVersion}.${override}".toString()]
    }
    // A shallow clone answers `rev-list --count` with 1 and exit 0, which is indistinguishable
    // from a real count, so ask git whether it is shallow rather than trusting the number.
    def shallow = gitOutput(['rev-parse', '--is-shallow-repository'])
    def count = shallow == 'false' ? gitOutput(['rev-list', '--count', 'HEAD']) : null
    def sha = count ? gitOutput(['rev-parse', '--short', 'HEAD']) : null
    if (!count || !sha) {
        logger.warn('isle: no usable git history here ({}), so this APK is version 1. ' +
                'Fetch the full history, or pass -PisleVersionCode=<n>.',
                shallow == null ? 'not a git repository' : 'shallow clone')
        return [1, "${projectVersion}+unknown".toString()]
    }
    return [count as int, "${projectVersion}.${count}+g${sha}".toString()]
}()

android {
    namespace "org.legoisland.isle"
    compileSdk 35
    // Connected tests uninstall their target APK; keep it separate from the player's installation.
    testBuildType 'touchTest'
    sourceSets.main {
        java.srcDir '../../CONFIG/android/src/main/java'
        res.srcDir '../../CONFIG/android/src/main/res'
    }

    defaultConfig {
        applicationId 'org.legoisland.isle'
        minSdk 21
        targetSdk 35
        versionCode isleVersion[0]
        versionName isleVersion[1]
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared', "-DFETCHCONTENT_BASE_DIR=${androidProject}/build/_deps"
                if (project.hasProperty('cmakeArgs')) {
                    project.cmakeArgs.split(" ").each {arg -> arguments arg}
                }
                abiFilters(*isleAbis)
            }
        }
    }
    externalNativeBuild {
        cmake {
            version "3.30.5"
            path '../../CMakeLists.txt'
        }
    }

    // One APK per architecture. The four native payloads are about 5.5 to 8.3 MiB each, so a
    // single APK makes every player download three architectures their device cannot load.
    splits {
        abi {
            enable true
            reset()
            include(*isleAbis)
            // Keep a works-anywhere APK too. Sideloading from the releases page is the only
            // distribution route, and a player who does not know their ABI needs something to
            // click. The splits are told apart by filename, so they share a version code;
            // installing one over another is a reinstall, not a downgrade.
            universalApk true
        }
    }

    signingConfigs {
        register("release") {
            enableV4Signing = true
            keyAlias = System.getenv("SIGNING_KEY_ALIAS")
            keyPassword = System.getenv("SIGNING_KEY_PASSWORD")
            System.getenv("SIGNING_STORE_FILE")?.with { storeFile = file(it) }
            storePassword = System.getenv("SIGNING_STORE_PASSWORD")
        }
    }
    buildTypes {
        touchTest {
            initWith debug
            applicationIdSuffix '.touchtest'
            matchingFallbacks = ['debug']
        }
        release {
            minifyEnabled true
            signingConfig = signingConfigs.getByName("release")
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        prefab true
    }
}

afterEvaluate {
    def androidPath = System.getenv("ANDROID_HOME") ?: android.sdkDirectory
    def ndkPath = System.getenv("ANDROID_NDK_HOME") ?: android.ndkDirectory

    tasks.named('compileSDL3AndroidArchive').configure {
        environment "ANDROID_HOME", androidPath
        environment "ANDROID_NDK_HOME", ndkPath
    }
}

def sdl3Dir = 'build/_deps/sdl3-src'
def sdl3SrcDir = file("${androidProject}/${sdl3Dir}")
def sdl3RevFile = file("${androidProject}/build/sdl3-rev.txt")
def aarDest = file("${projectDir}/libs/SDL3.aar")

// The revision downloadSDL3.cmake will check out, read from the file that names it for the
// whole repository so this build and the CMake one cannot disagree about what SDL3 is.
def sdl3Revision = {
    def declaration = file("${androidProject}/../CMake/SDL3Revision.cmake").text
    def matcher = declaration =~ /ISLE_SDL3_DEFAULT_GIT_TAG\s+"([^"]+)"/
    if (!matcher) {
        throw new GradleException("No ISLE_SDL3_DEFAULT_GIT_TAG in CMake/SDL3Revision.cmake")
    }
    return matcher[0][1]
}()

tasks.register('downloadSDL3', Exec) {
    workingDir = androidProject
    commandLine 'cmake', '-P', 'downloadSDL3.cmake'

    // Keyed on the pinned revision, which is the question an existing checkout could not
    // answer while the tag was "main": the old check treated any checkout as current, so a
    // moved pin would have kept building the .aar from whatever was already on disk.
    inputs.property('sdl3Revision', sdl3Revision)
    outputs.file(sdl3RevFile)

    doLast {
        def rev = ['git', '-C', sdl3SrcDir.path, 'rev-parse', 'HEAD'].execute()
        rev.waitFor()
        if (rev.exitValue() != 0) {
            throw new GradleException("Could not read the SDL3 revision in ${sdl3SrcDir}")
        }
        def head = rev.text.trim()
        // The check that would have caught the trees diverging in the first place.
        if (head != sdl3Revision) {
            throw new GradleException("SDL3 is at ${head}, expected the pinned ${sdl3Revision}")
        }
        sdl3RevFile.parentFile.mkdirs()
        sdl3RevFile.text = head
    }
}

tasks.register('compileSDL3AndroidArchive', Exec) {
    workingDir = androidProject
    dependsOn(downloadSDL3)

    commandLine 'python', "${sdl3Dir}/build-scripts/build-release.py",
            '--actions', 'download', 'android',
            '--fast', '--force',
            "--root=${sdl3Dir}", "--android-api=${android.defaultConfig.minSdk}"

    // What the archive is built from and against. Declaring them is what lets Gradle
    // answer "is it current?"; ensureSDL3 used to answer that by hand and only checked
    // that some archive existed, so changing minSdk silently kept one built for the old
    // API level.
    inputs.property('androidApi', android.defaultConfig.minSdk)
    inputs.file(sdl3RevFile)
    outputs.file(aarDest)

    doLast {
        def aarFile = file("${androidProject}/${sdl3Dir}/build-android").listFiles().find {
            it.name.endsWith(".aar")
        }
        aarDest.parentFile.mkdirs()
        aarFile.renameTo(aarDest)
    }
}

dependencies {
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    implementation "androidx.preference:preference:1.2.1"
    // Still unimplemented: with DOWNLOAD_DEPENDENCIES=OFF this should fetch the
    // matching 'devel android zip' release instead of building SDL from source, and
    // place its archive at aarDest.
    implementation files(aarDest).builtBy(compileSDL3AndroidArchive)
}
